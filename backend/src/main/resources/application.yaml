spring:
  application:
    name: wemadang
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]
  # optional : 파일이 없어도 에러내지 말고 넘어가라는 뜻
  # file : 프로젝트 내부 리소스가 아니라 실제 파일 경로에서 찾으라는 뜻
  # .env : 읽을 파일 이름 (보통 프로젝트 루트 기준)
  # [.properties] : 이 파일을 .properties 형식으로 해석하라는 뜻

springdoc:
  swagger-ui:
    enabled: true

chzzk:
  client-id: ${CHZZK_CLIENT_ID}
  client-secret: ${CHZZK_CLIENT_SECRET}
  redirection-url: ${CHZZK_REDIRECTION_URL}

  login-url: https://chzzk.naver.com/account-interlock

app:
  front-url: http://localhost:5173

server:
  servlet:
    context-path: /api
    session:
      timeout: 12h
